<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--PLAYABLES_SDK-->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Jigsaw Joy — Daily Puzzle</title>
    <meta name="description" content="Jigsaw Joy is a relaxing daily jigsaw game where every completed puzzle becomes a collectible art card." />
    <meta name="theme-color" content="#5B2A86" />
    <meta name="color-scheme" content="light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jigsaw Joy — Daily Puzzle" />
    <meta property="og:description" content="A relaxing daily jigsaw game where every completed puzzle becomes a collectible art card." />
    <meta property="og:image" content="og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      /* Critical CSS for the first frame (loading state). */
      html, body { margin: 0; height: 100%; background: #fbf6ee; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 600 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #3d2358; }
      .ld { display: grid; justify-items: center; gap: 14px; }
      .ld-card { width: 56px; height: 72px; border-radius: 10px; background: #5b2a86; box-shadow: inset 0 0 0 4px #5b2a86, inset 0 0 0 6px #e9b949; animation: ld 1.1s ease-in-out infinite alternate; }
      @keyframes ld { from { transform: rotate(-6deg) translateY(2px); } to { transform: rotate(6deg) translateY(-2px); } }
      @media (prefers-reduced-motion: reduce) { .ld-card { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loading" role="status" aria-live="polite"><div class="ld"><div class="ld-card" aria-hidden="true"></div><div>Jigsaw Joy · loading…</div></div></div>
      <main id="stage">
        <canvas id="board" tabindex="0" hidden aria-label="Puzzle board. Drag pieces from the tray onto the board, or use the arrow keys to choose a piece and Enter to pick it up and place it."></canvas>
        <header id="hud" class="hud" hidden></header>
      </main>
      <div id="screen" class="screen-layer" hidden></div>
      <div id="modal-root"></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="live" class="sr-only" aria-live="polite"></div>
    </div>
    <noscript><p style="padding:24px;font-family:system-ui">Jigsaw Joy needs JavaScript to run.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
